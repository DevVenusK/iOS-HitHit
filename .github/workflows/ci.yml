name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm-test:
    name: SwiftPM build & test (macOS host)
    # Swift Testing(`import Testing`)은 Swift 6.0+ 툴체인이 필요하다.
    # macos-14의 기본 Xcode 15.4(Swift 5.10)에서는 "no such module 'Testing'"으로 깨진다.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      # 주의: macOS 호스트에서는 canImport(UIKit)이 false이므로 UIKit 글루
      # (HitHitCollector / TrackingWindow / ScrollTracker)는 컴파일에서 제외된다.
      # 그 부분은 아래 ios-test 잡이 시뮬레이터에서 검증한다.
      - name: Test (순수 코어 + 파이프라인 + 동의OFF 게이트 + 성능예산)
        run: swift test

  ios-test:
    name: iOS simulator test (UIKit glue)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      # HitHitKit 스킴은 test 액션을 지원하지 않는다(라이브러리 product 전용).
      # 테스트 타겟이 포함된 스킴은 SwiftPM이 생성하는 HitHitKit-Package다.
      - name: Test on iOS Simulator (UIKit 글루 포함 전체)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available \
            | awk -F'[()]' '/iPhone/ {gsub(/ /,"",$2); print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "::error::사용 가능한 iPhone 시뮬레이터를 찾지 못했습니다."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $UDID"
          xcodebuild test \
            -scheme HitHitKit-Package \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
